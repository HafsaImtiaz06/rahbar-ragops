# Release-gate thresholds (C2). Read by eval/gate.py; on the cluster the same file is mounted
# from the ConfigMap `rahbar-eval-thresholds` (k8s/eval-job.yaml), so changing a value there
# changes the gate result without rebuilding any image.
#
# These are STARTING VALUES, not tuned ones: nobody has run the full suite on the real model
# yet. After the first complete run, set them from the measured numbers and record why.

# The baseline the gate compares with: a results file written by `gate.py promote`.
# (eval/baseline.json is the older run_eval.py baseline on a different, 15-question golden set;
# do not compare the 27-question suite against it.)
baseline: eval/baseline.m2.json

# Which metric is "recall@5" for the drop rule. The API-observed one guards the deployed system.
recall_metric: retrieval_api.recall_at_5

# Recall@5 may fall at most this many percentage points below the baseline.
max_recall_at_5_drop_pp: 2.0

# Faithfulness (answers supported by their cited passages) must be at least this.
min_faithfulness: 0.80

# 95th-percentile latency in seconds must be at most this. The ConfigMap's LLM_TIMEOUT is 240.
max_p95_latency_seconds: 240

# Abstention correctness may not be worse than baseline, minus this tolerance (0 = no drop).
abstention_tolerance: 0.0

# Citation validity floor (the original run_eval.py gate used 0.95).
min_citation_validity: 0.95

# Optional: the largest tolerated share of answerable questions that were refused.
# Leave null to switch it off.
max_over_abstention_rate: null
