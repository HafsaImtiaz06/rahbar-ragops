# Part E1: live query log. 42 queries written as if typed by students: 28 in the domain of the
# golden set (academic rules and fees) and 14 from topics the corpus and the golden set do not
# cover. `kind` is how the query was designed; `topic` is the label used to group uncovered
# queries in the E2 report. Coverage is measured against eval/golden.yaml (see query_coverage.py).
#   paraphrase  the same intent as a golden question, worded differently (should be covered)
#   domain      same documents as the golden set, but a topic no golden question asks about
#   offtopic    a topic the original corpus does not hold (Batch B adds some of them: drift, E3)

queries:
